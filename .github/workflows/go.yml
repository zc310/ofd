# 使用已发布的共享镜像构建、测试，不覆盖其中的兼容 Go 工具链。
name: Go Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Test CI runner
        run: python3 -B .github/ci/test_run.py

      - uses: ./.github/actions/setup-builder
        with:
          cache-scope: test

      - name: Build and test
        run: |
          # 仅全量构建、测试需要 Fyne / Gio 的 CGO 后端，不改变正式打包任务。
          bash .github/ci/run.sh env CGO_ENABLED=1 bash -e -o pipefail -c '
            go env GOOS GOARCH CGO_ENABLED CC
            go mod tidy
            go build -v ./...
            make fixtures
            go test -v -coverprofile=coverage.out -covermode=atomic ./...
          '

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
