# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libffi-dev \
            libxcursor-dev \
            libvulkan-dev \
            poppler-utils \
            fontconfig \
            fonts-wqy-zenhei \
            fonts-noto-cjk \
            curl \
            unzip

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true 

      - name: Tidy
        run: go mod tidy

      - name: Build Wails 3 viewer
        run: make build-wails

      - name: Build Gio viewer (desktop and WebAssembly)
        run: |
          make build-gio
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ofd-viewer-gio.wasm" ./cmd/ofd-viewer-gio

      - name: Build
        run: go build -v ./...

      - name: Download test fixtures
        run: make fixtures

      - name: Install test fonts in user directory
        run: |
          fonts_dir="$HOME/.local/share/fonts/hanzi-fonts"
          download_dir="$(mktemp -d "$RUNNER_TEMP/ofd-test-fonts.XXXXXX")"
          trap 'rm -rf "$download_dir"' EXIT
          base_url="https://github.com/zispace/hanzi-fonts/releases/download/v1.0"
          for archive in doc-foundertype.zip doc-zhongyi-etc.zip latin-fonts.zip; do
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              "$base_url/$archive" --output "$download_dir/$archive"
            mkdir -p "$fonts_dir/${archive%.zip}"
            unzip -q -o "$download_dir/$archive" -d "$fonts_dir/${archive%.zip}"
          done
          fc-cache -f "$fonts_dir"

      - name: Test
        env:
          EGL_PLATFORM: surfaceless
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
