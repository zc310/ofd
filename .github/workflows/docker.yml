# 打 tag 时构建 ofd-server 镜像并推到 GHCR；PR 上只构建不推送。
#
# 两条触发路径：
#   tag v*        构建并推送，镜像 tag 由 git tag 推导（v0.1.4 → 0.1.4）
#   pull_request  仅构建。Dockerfile 写错要在合并前就暴露，而不是等发版才发现。
#                 这一条是 GitHub 模板里带的，比只监听 tag 周全。
#
# 不在 main 上产生 latest：latest 会让"这个镜像对应哪次提交"变得不可知，正式
# 部署出错时很难回溯是哪份代码。需要追踪 main 的开发镜像时用 ghcr.io 的 digest
# 引用。
#
# amd64 与 arm64 分别在原生 runner 上构建，避免用 QEMU 模拟 arm64 时的慢构建。
# 发布时先推架构专属 tag，再合并成同一组多架构版本 tag。
#
# 不跑容器做冒烟测试：镜像内置的 docker-config.json 把 api_key 留空，不给令牌
# 容器会直接拒绝启动（这是有意的，放占位符等于随镜像发布一把公开的钥匙），
# 所以"跑起来看是否正常"必须先造令牌，反而把流程弄复杂。Dockerfile 自带的
# RUN ofd-server --help 与 HEALTHCHECK /readyz 已经在构建期验证了二进制可执行。
name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    # 只在与构建相关的文件变动时才跑：一次完整构建要装 LibreOffice 与 Chrome，
    # 不加限制的话每个 PR（包括只改文档的）都要等十几分钟。
    paths:
      - "cmd/ofd-server/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read
  packages: write        # 推 GHCR；PR 上不推送，这个权限用不上

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # 每个 runner 原生构建自己的架构；buildx 将 TARGETARCH 传给 Dockerfile，
      # 由它选择 Google Chrome 或 Chromium。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # 用 GITHUB_TOKEN 登录 ghcr.io：不需要额外配 secret，也不会把仓库凭据
      # 写进日志。GITHUB_TOKEN 的包推送权限由顶层 packages: write 提供。
      #
      # PR 上跳过登录：来自 fork 的 PR 其 GITHUB_TOKEN 是只读的，登录与推送都会
      # 失败，而这个 job 本来就不该对外推送。
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 在 shell 里算好再用。GitHub 表达式没有 ${var#pattern} 这类参数
      # 展开，写成 ${{ github.ref_name#v }} 会在解析阶段报 "Unexpected symbol"。
      #
      # 每个架构先使用独立 tag；发布 job 再将它们合并为不带架构后缀的多架构 tag。
      # PR 路径只 load 到 runner 本地，不会推上去。
      - name: Resolve image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}/ofd-server"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "$image:pr-${{ github.event.number }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME#v}"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "$image:$ref-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
            echo "$image:${GITHUB_REF_NAME}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/ofd-server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          # PR 上把当前 runner 架构的镜像载入本地，确认构建产物可用但不推送。
          load: ${{ github.event_name == 'pull_request' }}
          # 镜像有 apt 安装、Chrome 下载和 Go 编译三层，缓存命中能省掉大部分时间。
          # mode=max 连中间层一起缓存，否则每层都要重新跑。
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture tags
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}/ofd-server"
          ref="${GITHUB_REF_NAME#v}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$image:$ref" >> "$GITHUB_OUTPUT"
          echo "$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create multi-architecture manifests
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<< "$IMAGE_TAGS"
