# 构建浏览器阅读器和 Fyne Web 阅读器并发布到 GitHub Pages。
#
# 页面分别放在站点根下的 wasm/ 和 fyne/ 子目录，访问地址：
#   https://zc310.github.io/ofd/wasm/  （cmd/ofd-wasm）
#   https://zc310.github.io/ofd/fyne/  （cmd/ofd-viewer）
#
# 两套页面的资源都使用相对路径，可直接放到子目录。浏览器阅读器的 Service Worker
# 也用相对路径注册且没写死 scope，作用域自动等于所在目录，不影响 fyne/。
name: Pages

on:
  push:
    branches: ["main"]
    # 只在两个阅读器及其依赖变化时重建，避免无关提交重新编译 WASM。
    #
    # 下面是两个入口的依赖闭包并集，可用下面这条命令核对（务必用 wasm 目标，
    # 宿主机下 cmd/ofd-wasm 没有可构建文件，go list 会只列出它自己）：
    #
    #   CGO_ENABLED=0 GOOS=js GOARCH=wasm go list -tags latex,release -deps ./cmd/ofd-wasm ./cmd/ofd-viewer \
    #     | grep '^github.com/zc310/ofd/' | sed 's|github.com/zc310/ofd/||' \
    #     | cut -d/ -f1-2 | sort -u
    #
    # 新增依赖包后要同步补进来，漏掉的包改动不会触发部署，用户会一直用旧版页面。
    paths:
      - "cmd/ofd-wasm/**"
      - "cmd/ofd-viewer/**"
      - "pkg/converter/**"
      - "pkg/spec/**"
      - "pkg/webreader/**"
      - "internal/cache/**"
      - "internal/coloricc/**"
      - "internal/cidmap/**"
      - "internal/container/**"
      - "internal/fastxml/**"
      - "internal/fileutil/**"
      - "internal/fontrepair/**"
      - "internal/localization/**"
      - "internal/parser/**"
      - "internal/pdf2ofd/config/**"
      - "internal/render/**"
      - "internal/models/**"
      - "internal/media/**"
      - "internal/search/**"
      - "internal/ses/**"
      - "internal/textdoc/**"
      - "internal/version/**"
      - "internal/xmlcodec/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pages.yml"
  # 手动触发用于验证 Pages 配置，不受 paths 限制。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次部署：排队中的旧构建直接取消。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      # 用官方 release 的预编译 binaryen，不用 apt 的：noble 源里只有 108，
      # 而 Makefile 的 WASM_OPT_FLAGS 含 --enable-bulk-memory-opt、
      # --disable-strings、--disable-compact-imports，这三个 108 不认，
      # wasm-opt 会报 "Unknown option" 直接退出——Makefile 那步没有兜底，
      # 构建就挂了。实测 108 只能省 8% 体积，不值得为此放弃优化。
      - name: Install binaryen
        run: |
          BINARYEN_VERSION=133
          BASE="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}"
          FILE="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSL --fail --max-time 600 -o "/tmp/$FILE" "$BASE/$FILE"
          curl -sSL --fail --max-time 60 -o "/tmp/$FILE.sha256" "$BASE/$FILE.sha256"
          (cd /tmp && sha256sum -c "$FILE.sha256")
          tar -xzf "/tmp/$FILE" -C /tmp
          sudo install -m755 "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          # 选项与 Makefile 的 WASM_OPT_FLAGS 对齐，版本不够会在这一步暴露，
          # 而不是等到 make build-wasm 才失败。
          wasm-opt --enable-bulk-memory-opt --disable-strings --disable-compact-imports --version

      # build-wasm 负责三件事：编译 ofd.wasm、按需跑 wasm_opt、从 GOROOT 复制
      # wasm_exec.js，并按各资源内容哈希重算 service-worker.js 里的 CACHE_NAME。
      - name: Build WASM
        run: make build-wasm

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Fyne Web
        run: make build-viewer-web

      # viewer.js 的改动要在 Node 里跑一遍：这些测试从源码按括号配平切出待测
      # 函数，改了断行或导出就会失效。
      - name: Test web scripts
        run: make test-wasm-web

      # upload-pages-artifact 不支持排除项，先把要发布的文件挑到 _site。
      # 只放 wasm/ 和 fyne/ 子目录，仓库其余内容不进 Pages。
      #
      # 剔掉 test/：那是本地跑 make test-wasm-web 用的测试脚本，页面上没有入口。
      # README.md 和 THIRD_PARTY_NOTICES.md 保留——后者是第三方许可声明。
      - name: Stage site
        run: |
          mkdir -p _site/wasm _site/fyne
          cp -a cmd/ofd-wasm/web/. _site/wasm/
          cp -a cmd/ofd-viewer/wasm/. _site/fyne/
          cp cmd/ofd-wasm/web/THIRD_PARTY_NOTICES.md _site/fyne/
          cp internal/cidmap/NOTICE _site/fyne/ADOBE-GB1-NOTICE
          rm -rf _site/wasm/test
          echo "发布内容："
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
