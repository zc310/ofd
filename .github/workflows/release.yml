name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Linux 正式桌面包使用 Ubuntu 24.04 原生 runner，与共享编译、测试镜像的系统基线一致。
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build Linux viewer and command-line tools
        run: |
          make package-desktop VERSION="${RELEASE_TAG#v}"
          make package-wails VERSION="${RELEASE_TAG#v}"

      - name: Install nFPM and RPM inspection tools
        run: |
          make install-nfpm
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y rpm

      - name: Test and build Linux amd64 thumbnailer DEB and RPM
        run: |
          go test ./cmd/ofd-thumbnailer -run '^TestThumbnailerNativePackages$' -count=1
          make package-thumbnailer-linux GOOS=linux GOARCH=amd64 VERSION="${RELEASE_TAG#v}"

      - name: Test and build Linux amd64 viewer DEB and RPM
        run: |
          go test ./cmd/ofd-viewer -run '^TestViewer(NativePackages|PackageCacheUpdates)$' -count=1
          make package-viewer-linux GOOS=linux GOARCH=amd64 VERSION="${RELEASE_TAG#v}"
          make package-wails-linux GOOS=linux GOARCH=amd64 CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            /tmp/ofd/dist/*.zip
            /tmp/ofd/dist/*.deb
            /tmp/ofd/dist/*.rpm
          if-no-files-found: error
          retention-days: 1

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build Linux arm64 viewer and command-line tools
        run: |
          make package-arm64 VERSION="${RELEASE_TAG#v}"
          make package-viewer GOOS=linux GOARCH=arm64 CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"
          make package-wails GOOS=linux GOARCH=arm64 CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"

      - name: Install nFPM and RPM inspection tools
        run: |
          make install-nfpm
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y rpm

      - name: Test and build Linux arm64 thumbnailer DEB and RPM
        run: |
          go test ./cmd/ofd-thumbnailer -run '^TestThumbnailerNativePackages$' -count=1
          make package-thumbnailer-linux GOOS=linux GOARCH=arm64 VERSION="${RELEASE_TAG#v}"

      - name: Test and build Linux arm64 viewer DEB and RPM
        run: |
          go test ./cmd/ofd-viewer -run '^TestViewer(NativePackages|PackageCacheUpdates)$' -count=1
          make package-viewer-linux GOOS=linux GOARCH=arm64 VERSION="${RELEASE_TAG#v}"
          make package-wails-linux GOOS=linux GOARCH=arm64 CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            /tmp/ofd/dist/*.zip
            /tmp/ofd/dist/*.deb
            /tmp/ofd/dist/*.rpm
          if-no-files-found: error
          retention-days: 1

  darwin-tools:
    name: macOS command-line tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: ./.github/actions/setup-builder
        with:
          cache-scope: darwin-tools

      - name: Build macOS command-line tools
        run: |
          bash .github/ci/run.sh bash -e -o pipefail -c '
            make package-darwin-arm64 VERSION="${RELEASE_TAG#v}"
            make package-darwin-amd64 VERSION="${RELEASE_TAG#v}"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-tools
          path: /tmp/ofd/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-amd64:
    name: Windows amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: ./.github/actions/setup-builder
        with:
          cache-scope: windows-amd64

      - name: Build Windows amd64 viewer, Wails reader, and command-line tools
        run: |
          bash .github/ci/run.sh bash -e -o pipefail -c '
            make package-windows-amd64 VERSION="${RELEASE_TAG#v}"
            make GOOS=windows GOARCH=amd64 CGO_ENABLED=0 package-wails package-wails-installer VERSION="${RELEASE_TAG#v}"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: |
            /tmp/ofd/dist/*.zip
            /tmp/ofd/dist/*setup.exe
          if-no-files-found: error
          retention-days: 1

  windows-arm64:
    name: Windows arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: ./.github/actions/setup-builder
        with:
          cache-scope: windows-arm64

      - name: Build Windows arm64 viewer, Wails reader, and command-line tools
        run: |
          bash .github/ci/run.sh bash -e -o pipefail -c '
            make package-windows-arm64 VERSION="${RELEASE_TAG#v}"
            make GOOS=windows GOARCH=arm64 CGO_ENABLED=0 package-wails package-wails-installer VERSION="${RELEASE_TAG#v}"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: |
            /tmp/ofd/dist/*.zip
            /tmp/ofd/dist/*setup.exe
          if-no-files-found: error
          retention-days: 1

  darwin-viewer:
    name: macOS ${{ matrix.arch }} viewer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Install Gio packaging tool
        run: |
          go install gioui.org/cmd/gogio@v0.10.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS viewer ZIP and app bundle
        run: |
          make package-viewer GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"
          make package-wails GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=1 VERSION="${RELEASE_TAG#v}"
          gogio -target macos -arch ${{ matrix.arch }} -appid io.github.zc310.ofd \
            -icon cmd/ofd-viewer/appicon.png -ldflags "-X github.com/zc310/ofd/internal/version.Version=${RELEASE_TAG#v}" \
            -o "cmd/ofd-viewer/OFD Viewer.app" ./cmd/ofd-viewer

      - name: Create macOS DMG
        run: |
          APP_PATH="$GITHUB_WORKSPACE/cmd/ofd-viewer/OFD Viewer.app"
          test -d "$APP_PATH"
          STAGING_DIR="$RUNNER_TEMP/ofd-viewer-dmg"
          mkdir -p "$STAGING_DIR" /tmp/ofd/dist
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "OFD Viewer" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "/tmp/ofd/dist/ofd-viewer-darwin-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-viewer-${{ matrix.arch }}
          path: |
            /tmp/ofd/dist/*.zip
            /tmp/ofd/dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4.0.4
        with:
          # Install the SDK packages together below instead of invoking sdkmanager twice.
          packages: ""

      - name: Install Android SDK and NDK
        run: |
          ANDROID_NDK_VERSION=30.0.16248370
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;37.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Gio packaging tool
        run: |
          go install gioui.org/cmd/gogio@v0.10.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Android APK and ZIP
        run: make package-viewer-android-zip VERSION="${RELEASE_TAG#v}" VIEWER_VERSION="${RELEASE_TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: android-viewer
          path: |
            /tmp/ofd/dist/ofd-viewer-android.apk
            /tmp/ofd/dist/ofd-viewer-android.zip
          if-no-files-found: error
          retention-days: 1

  wasm:
    name: WebAssembly reader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: ./.github/actions/setup-builder
        with:
          cache-scope: wasm

      - name: Build and test web reader
        run: |
          bash .github/ci/run.sh bash -e -o pipefail -c '
            make test-wasm-web
            make package-wasm-web VERSION="${RELEASE_TAG#v}"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-web
          path: /tmp/ofd/dist/ofd-wasm-web.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - linux-amd64
      - linux-arm64
      - darwin-tools
      - windows-amd64
      - windows-arm64
      - darwin-viewer
      - android
      - wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --notes-file docs/RELEASE-ASSETS.md \
            --generate-notes
