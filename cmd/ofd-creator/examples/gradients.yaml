# ofd-creator gradient showcase
# Run:
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/gradients.yaml -o gradients.ofd --validate

version: 1
document:
  id: gradient-showcase
  title: OFD Gradient Showcase
  creator: ofd-creator
  creator_version: "1"
  page_size:
    width: 210.0
    height: 297.0

pages:
  - items:
      # Axial gradient: left-to-right multi-stop color transition.
      - type: path
        x: 15.0
        y: 15.0
        width: 180.0
        height: 45.0
        fill: true
        data: M 0 0 L 180 0 L 180 45 L 0 45 C
        fill_color:
          axial:
            map_type: Direct
            start_point: "0 0"
            end_point: "180 0"
            extend: 0
            segments:
              - position: 0.0
                color: {b: 180}
              - position: 0.5
                color: {b: 210}
              - position: 1.0
                color: {b: 55}

      # Radial gradient: bright center fading into a dark edge.
      - type: path
        x: 15.0
        y: 70.0
        width: 85.0
        height: 70.0
        fill: true
        data: M 0 0 L 85 0 L 85 70 L 0 70 C
        fill_color:
          radial:
            map_type: Direct
            start_point: "42.5 35"
            start_radius: 0.0
            end_point: "42.5 35"
            end_radius: 55.0
            extend: 0
            segments:
              - position: 0.0
                color: {b: 180}
              - position: 0.45
                color: {b: 45}
              - position: 1.0
                color: {b: 95}

      # Gouraud triangular mesh gradient.
      - type: path
        x: 110.0
        y: 70.0
        width: 85.0
        height: 70.0
        fill: true
        data: M 0 0 L 85 0 L 85 70 L 0 70 C
        fill_color:
          gouraud:
            points:
              - x: 0.0
                y: 0.0
                edge_flag: 0
                color: {b: 80}
              - x: 85.0
                y: 0.0
                edge_flag: 1
                color: {b: 245}
              - x: 85.0
                y: 70.0
                edge_flag: 2
                color: {b: 125}
              - x: 0.0
                y: 70.0
                edge_flag: 2
                color: {b: 60}

      # LaGouraud quadrilateral mesh gradient.
      - type: path
        x: 15.0
        y: 150.0
        width: 85.0
        height: 70.0
        fill: true
        data: M 0 0 L 85 0 L 85 70 L 0 70 C
        fill_color:
          la_gouraud:
            vertices_per_row: 2
            extend: 0
            points:
              - x: 0.0
                y: 0.0
                color: {b: 220}
              - x: 85.0
                y: 0.0
                color: {b: 160}
              - x: 0.0
                y: 70.0
                color: {b: 130}
              - x: 85.0
                y: 70.0
                color: {b: 45}

      # Pattern containing a small diagonal accent path.
      - type: path
        x: 110.0
        y: 150.0
        width: 85.0
        height: 70.0
        fill: true
        data: M 0 0 L 85 0 L 85 70 L 0 70 C
        fill_color:
          pattern:
            width: 12.0
            height: 12.0
            x_step: 12.0
            y_step: 12.0
            relative_to: Object
            items:
              - type: path
                width: 12.0
                height: 12.0
                stroke: true
                fill: false
                line_width: 0.8
                data: M 0 12 L 12 0 C
                stroke_color: {b: 140}
              - type: path
                width: 12.0
                height: 12.0
                fill: true
                data: M 0 0 L 4 0 L 4 4 L 0 4 C
                fill_color: {b: 40}
