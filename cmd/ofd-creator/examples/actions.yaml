# 动作示例
# 覆盖点击打开 URI、书签跳转、音频/视频播放与附件动作（GotoA 打开文档内附件）。
# 三个 GotoA 均显式带 NewWindow 新窗口参数，覆盖 true/false 两种取值：
#   demo-note 打开文本附件（true）；demo-ofd 打开内嵌的最小单页 OFD 测试文件（true，
#   单页单文字，由本工具 --deterministic 生成，字节内联为 data_base64，保持单文件可重建）；
#   demo-inline 打开文本附件（false，同一窗口）。
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/actions.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/actions.yaml -o test/testdata/actions.ofd --format auto --deterministic --validate --complete-text-code-deltas

version: 1
document:
  id: actions
  title: 动作示例
  creator: ofd-creator
  creator_version: 0.0.1
  page_size:
    name: A4
  bookmarks:
    - name: 第二页
      goto:
        page: 1
        type: XYZ
        top: 20
  attachments:
    - id: demo-note
      name: 说明.txt
      format: txt
      usage: source
      file_name: demo-note.txt
      data_base64: 6L+Z5piv6YCa6L+HIEdvdG9BIOmZhOS7tuWKqOS9nOaJk+W8gOeahOmZhOS7tuOAggo=
    - id: demo-ofd
      name: mini.ofd
      format: ofd
      usage: source
      file_name: mini.ofd
      data_base64: 
    - id: demo-inline
      name: inline.txt
      format: txt
      usage: source
      file_name: inline.txt
      data_base64: TmV3V2luZG93PWZhbHNlIOekuuS+i++8muWcqOWQjOS4gOeql+WPo+aJk+W8gOeahOaWh+acrOmZhOS7tuOAggo=
  actions:
    - event: CLICK
      uri:
        uri: https://github.com/zc310/ofd
        target: _blank
    - event: CLICK
      goto:
        bookmark: 第二页
    - event: PO
      sound:
        resource_id: 21
        volume: 80
        repeat: false
    - event: CLICK
      movie:
        resource_id: 22
        operator: Play
    # GotoA 顺序有约束：webreader 按动作顺序生成热区，并以最后一条附件链接为准
    #（TestDocumentClickActionsMatchPageText 断言 demo-note），故 demo-ofd、demo-inline
    # 必须排在 demo-note 之前。
    - event: CLICK
      goto_a:
        attach_id: demo-ofd
        new_window: true
    - event: CLICK
      goto_a:
        attach_id: demo-inline
        new_window: false
    - event: CLICK
      goto_a:
        attach_id: demo-note
        new_window: true
resources:
  media:
    - id: 21
      type: Audio
      format: wav
      name: tone.wav
      data_base64: UklGRgAAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=
    - id: 22
      type: Video
      format: mp4
      name: clip.mp4
      data_base64: AAAAGGZ0eXBtcDQyAAAA
pages:
  - items:
      - type: text
        x: 20
        y: 30
        width: 170
        height: 10
        value: URI / 书签 / 声音 / 影片 / 附件
        font: 宋体
        size: 6
        fill: true
      - type: text
        x: 20
        y: 50
        width: 170
        height: 8
        value: 点击打开 https://github.com/zc310/ofd
        font: 宋体
        size: 4
        fill: true
      - type: text
        x: 20
        y: 64
        width: 170
        height: 8
        value: 书签跳到第二页
        font: 宋体
        size: 4
        fill: true
      - type: text
        x: 20
        y: 78
        width: 170
        height: 8
        value: 打开附件 说明.txt（GotoA）
        font: 宋体
        size: 4
        fill: true
      - type: text
        x: 20
        y: 92
        width: 170
        height: 8
        value: 打开附件 mini.ofd（GotoA 新窗口）
        font: 宋体
        size: 4
        fill: true
      - type: text
        x: 20
        y: 106
        width: 170
        height: 8
        value: 打开附件 inline.txt（GotoA 同窗口）
        font: 宋体
        size: 4
        fill: true
  - items:
      - type: text
        x: 20
        y: 30
        width: 170
        height: 10
        value: 第二页
        font: 宋体
        size: 8
        fill: true
