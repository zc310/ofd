version: 1
document:
  id: draw-params
  title: 绘制参数示例
  creator: ofd-creator
  creator_version: 0.0.1
  page_size:
    name: A4
resources:
  draw_params:
    - name: base
      line_width: 1.2
      cap: Butt
      join: Miter
      miter_limit: 8
      fill_color:
        r: 220
        g: 50
        b: 50
      stroke_color:
        r: 30
        g: 30
        b: 30
    - name: thick
      relative: base
      line_width: 4
      cap: Round
      join: Round
    - name: dashed
      relative: thick
      dash_pattern:
        - 6
        - 3
      dash_offset: 2
      stroke_color:
        r: 30
        g: 90
        b: 180
pages:
