# 文档版本示例
# v1 只包含第一页，默认版本 v2 增加第二页。
# GB/T 33190—2016 §19：version 为 OFD 格式版本，files 列出各版本所需的全部文件。
# files.path 输入相对于 Doc_0，输出为包内绝对路径；版本入口也使用包内绝对路径。
# Index 使用 1、2；与包内绝对路径组合的表达已通过官方及第三方阅读器复测。
# 两个版本的 MaxUnitID 分别为 6、9，并共享 DocumentRes.xml 和第一页。
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/versions.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/versions.yaml -o testdata/versions.ofd --format auto --deterministic --validate --complete-text-code-deltas

version: 1
document:
  id: da830124a1344fc1a619b610d83b7b38
  title: 文档版本示例
  creator: ofd-creator
  creator_version: 0.0.1
  page_size:
    name: A4
  versions:
    - id: v1
      index: 1
      version: "1.0"
      name: 初始版本
      creation_date: "2026-01-02"
      doc_root_name: version-1.xml
      doc_root_base64: 
      files:
        - id: v1-file-1
          path: Versions/Files/version-1.xml
        - id: v1-file-2
          path: DocumentRes.xml
        - id: v1-file-3
          path: Pages/Page_0/Content.xml
    - id: v2
      index: 2
      current: true
      version: "1.0"
      name: 当前版本
      creation_date: "2026-03-15"
      doc_root_name: version-2.xml
      doc_root_base64: 
      files:
        - id: v2-file-1
          path: Versions/Files/version-2.xml
        - id: v2-file-2
          path: DocumentRes.xml
        - id: v2-file-3
          path: Pages/Page_0/Content.xml
        - id: v2-file-4
          path: Pages/Page_1/Content.xml
