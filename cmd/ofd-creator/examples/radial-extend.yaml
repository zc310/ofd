# 径向渐变 Extend 与 MapType / MapUnit 示例
# 5 页 22 个路径（起止圆短于所在圆）：第 1 页展示 Direct 下 Extend 0、1、2、3 的延伸
# 行为（红→黄→蓝三色段按 0/0.5/1 均匀分布），下排为 Direct 的 Repeat/Reflect 对照，
# 第 2、3 页分别覆盖 MapType=Repeat / Reflect × Extend 0/1/2/3（MapUnit=12），
# 第 4、5 页为 start_point 偏离圆心的偏心径向 Extend 对照：两页各四格几何完全相同、
# 只有 Extend 不同，可直接横向对比。第 4 页取两圆外离几何（start=(18,35) r=8 →
# end=(52,35) r=18，圆心距 34 > r0+r1=26），第 5 页取内含几何（start=(18,35) r=6 →
# end=(25,35) r=14，圆心距 7 < 半径差 8）。
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/radial-extend.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/radial-extend.yaml -o radial-extend.ofd --format auto --deterministic --validate

#
# 生成：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/radial-extend.yaml -o testdata/radial-extend.ofd --format auto --deterministic --validate --complete-text-code-deltas
