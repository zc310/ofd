# 封面与复合图元缩略图示例
# 覆盖文档级 Cover 封面（cover_base64 内嵌 + cover_name 指定包内文件名，写入
# Doc_0/Cover/cover.png 并在 OFD.xml DocInfo 中输出 <Cover>）与复合图元
# CompositeGraphicUnit 的 Thumbnail 缩略图引用（指向 resources.images 图片，
# 输出 <Thumbnail> 子元素）。
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/cover-thumbnail.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/cover-thumbnail.yaml -o test/testdata/cover-thumbnail.ofd --format auto --deterministic --validate

version: 1
document:
  id: cover-thumbnail
  title: 封面与复合图元缩略图
  creator: ofd-creator
  creator_version: 0.0.1
  page_size:
    name: A4
