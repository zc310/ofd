#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/shading.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/shading.yaml -o test/testdata/shading.ofd --format auto --deterministic --validate --complete-text-code-deltas

