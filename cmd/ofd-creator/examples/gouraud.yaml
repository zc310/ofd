# GouraudShd 三角网格渐变
# 1 页 6 格覆盖不同网格类型：单三角形、三角带（EdgeFlag=1 连续拼接）、
# 扇形辐射（EdgeFlag=2，中心向外）、独立三角对（EdgeFlag=0 分组起始），
# 以及 Extend=0 / Extend=1+Back Color 对照（灰色衬底用于显示网格未覆盖
# 区域是透明透出还是被 BackColor 填充）。
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/gouraud.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/gouraud.yaml -o testdata/gouraud.ofd --format auto --deterministic --validate --complete-text-code-deltas

version: 1
document:
  id: gouraud
  title: GouraudShd 三角网格渐变
  creator: ofd-creator
  creator_version: 0.0.1
  page_size:
    name: A4
