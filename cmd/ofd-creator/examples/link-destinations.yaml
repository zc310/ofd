# 跳转目标类型示例
# 覆盖 Goto/Dest 的五种目标类型与缩放比例：
#   - Fit   整页适配窗口，不指定位置
#   - FitH  页高适配窗口，并滚动到 Top
#   - FitV  页宽适配窗口，并滚动到 Left
#   - XYZ   定位到 (Left, Top)，缩放取 Zoom；Zoom 省略时保持阅读器当前缩放
#   - FitR  把 Left/Top/Right/Bottom 矩形适配窗口
#
# 每个目标的坐标都不为零，以便与「坐标为零」的情形区分开：坐标为零时目标类型容易
# 被相邻类型吞掉，例如 Left 为 0 的 XYZ 与 FitH 无法区分。
#
# 热区用不可见的 PathObject 承载，与 links.yaml 相同：热区只是点击范围，不该画出来。
# PDF 导出会把这些跳转写成命名目标，转 PDF 后同样可点击。
#
# 运行：
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/link-destinations.yaml --format auto --check
#   go run ./cmd/ofd-creator -i cmd/ofd-creator/examples/link-destinations.yaml -o testdata/link-destinations.ofd --format auto --deterministic --validate --complete-text-code-deltas

