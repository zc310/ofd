<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Material 风格 1 - 三圆徽章 + 粗体字母 -->
  <rect width="256" height="256" rx="48" fill="#fafafa"/>
  
  <!-- 三个彩色圆 -->
  <circle cx="68" cy="118" r="48" fill="#1e88e5"/>
  <circle cx="128" cy="118" r="48" fill="#e53935"/>
  <circle cx="188" cy="118" r="48" fill="#43a047"/>
  
  <!-- 白色字母 -->
  <text x="68" y="122" font-family="'Arial Black',sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">O</text>
  <text x="128" y="122" font-family="'Arial Black',sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">F</text>
  <text x="188" y="122" font-family="'Arial Black',sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">D</text>
  
  <text x="128" y="210" font-family="'Google Sans','Product Sans','Helvetica Neue',sans-serif" font-size="16" font-weight="500" fill="#5f6368" text-anchor="middle" letter-spacing="2">OFD Viewer</text>
</svg>